<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FAST_GREY Position LUT Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { margin-bottom: 20px; font-size: 24px; color: #0af; }
        h2 { margin: 20px 0 10px; font-size: 18px; color: #888; }
        .container { display: flex; gap: 30px; flex-wrap: wrap; }
        .panel {
            background: #252540;
            border-radius: 8px;
            padding: 20px;
            min-width: 300px;
        }
        .lut-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .lut-table th, .lut-table td {
            padding: 6px 10px;
            text-align: center;
            border: 1px solid #333;
        }
        .lut-table th { background: #333; }
        .lut-table input {
            width: 50px;
            padding: 4px;
            text-align: center;
            background: #1a1a2e;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }
        .lut-table input:focus { border-color: #0af; outline: none; }
        canvas {
            background: #1a1a2e;
            border-radius: 8px;
            display: block;
            margin-bottom: 20px;
        }
        .transitions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            font-size: 12px;
        }
        .transition {
            background: #333;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }
        .transition .frames { font-size: 18px; font-weight: bold; color: #0f0; }
        .transition .path { color: #888; font-size: 10px; margin-top: 4px; word-break: break-all; }
        .legend { display: flex; gap: 20px; margin: 10px 0; font-size: 12px; }
        .legend span { display: flex; align-items: center; gap: 5px; }
        .legend .dot { width: 12px; height: 12px; border-radius: 50%; }
        .targets { margin: 10px 0; font-size: 12px; color: #888; }
        button {
            padding: 8px 16px;
            background: #0af;
            border: none;
            border-radius: 4px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
        }
        button:hover { opacity: 0.8; }
        .code-output {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            white-space: pre;
            overflow-x: auto;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .config-panel {
            background: #252540;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .config-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .config-item label {
            font-size: 14px;
            color: #888;
        }
        .config-item input {
            width: 60px;
            padding: 6px;
            text-align: center;
            background: #1a1a2e;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
        }
        .config-item input:focus { border-color: #0af; outline: none; }
        .targets-display {
            font-size: 14px;
            color: #eee;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>FAST_GREY Position LUT Curve Editor</h1>

    <div class="config-panel">
        <div class="config-item">
            <label>DG Position:</label>
            <input type="number" id="dgPos" min="1" max="15" value="5" onchange="updateTargets()">
        </div>
        <div class="config-item">
            <label>LG Position:</label>
            <input type="number" id="lgPos" min="1" max="15" value="12" onchange="updateTargets()">
        </div>
        <div class="targets-display" id="targetsDisplay">
            B=0, DG=5, LG=12, W=16
        </div>
    </div>

    <div class="container">
        <div class="panel">
            <h2>Toward White (+)</h2>
            <table class="lut-table" id="whiteLut">
                <tr><th>Position</th><th>Step</th></tr>
            </table>
            <canvas id="whiteCanvas" width="400" height="200"></canvas>
            <div class="legend">
                <span><div class="dot" style="background:#0f0"></div> Step size</span>
                <span><div class="dot" style="background:#08f"></div> Position after step</span>
            </div>
        </div>

        <div class="panel">
            <h2>Toward Black (-)</h2>
            <table class="lut-table" id="blackLut">
                <tr><th>Position</th><th>Step</th></tr>
            </table>
            <canvas id="blackCanvas" width="400" height="200"></canvas>
            <div class="legend">
                <span><div class="dot" style="background:#f00"></div> Step size</span>
                <span><div class="dot" style="background:#f80"></div> Position after step</span>
            </div>
        </div>

        <div class="panel" style="min-width: 500px;">
            <h2>Frame Counts (all 12 transitions)</h2>
            <div class="transitions" id="transitions"></div>

            <button onclick="copyVerilog()">Copy Verilog</button>
            <button onclick="resetToDefault()">Reset to Default</button>

            <div class="code-output" id="verilogCode"></div>
        </div>
    </div>

    <script>
        // Current LUT values - matching rtl/pixel_processing.v (5/4/3/2/1 uniform curve)
        let whiteLut = [5,4,3,3,3,3,3,3,3,3,2,2,2,1,1,1,1]; // 0:5, 1:4, 2-9:3, 10-12:2, 13-16:1
        let blackLut = [3,3,3,2,2,2,2,2,2,2,2,2,2,2,3,4,5]; // 0-2:3, 3-13:2, 14:3, 15:4, 16:5

        let targets = { B: 0, DG: 5, LG: 12, W: 16 };

        function updateTargets() {
            const dg = parseInt(document.getElementById('dgPos').value) || 5;
            const lg = parseInt(document.getElementById('lgPos').value) || 11;

            // Validate and enforce DG < LG
            if (dg >= lg) {
                alert('DG must be less than LG');
                document.getElementById('dgPos').value = targets.DG;
                document.getElementById('lgPos').value = targets.LG;
                return;
            }

            targets.DG = dg;
            targets.LG = lg;

            // Update display
            document.getElementById('targetsDisplay').textContent =
                `B=${targets.B}, DG=${targets.DG}, LG=${targets.LG}, W=${targets.W}`;

            update();
        }

        function initLutTable(tableId, lut, onChange) {
            const table = document.getElementById(tableId);
            for (let pos = 0; pos <= 16; pos++) {
                const row = table.insertRow();
                const cellPos = row.insertCell();
                const cellStep = row.insertCell();
                cellPos.textContent = pos;
                const input = document.createElement('input');
                input.type = 'number';
                input.min = 1;
                input.max = 7;
                input.value = lut[pos];
                input.onchange = (e) => {
                    lut[pos] = parseInt(e.target.value) || 1;
                    onChange();
                };
                cellStep.appendChild(input);
            }
        }

        function drawCurve(canvasId, lut, color1, color2, direction) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const padding = 30;

            ctx.clearRect(0, 0, w, h);

            // Grid
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 16; i++) {
                const x = padding + (i / 16) * (w - 2 * padding);
                ctx.beginPath();
                ctx.moveTo(x, padding);
                ctx.lineTo(x, h - padding);
                ctx.stroke();
            }
            for (let i = 0; i <= 7; i++) {
                const y = h - padding - (i / 7) * (h - 2 * padding);
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(w - padding, y);
                ctx.stroke();
            }

            // Axes labels
            ctx.fillStyle = '#888';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Position', w/2, h - 5);
            ctx.save();
            ctx.translate(10, h/2);
            ctx.rotate(-Math.PI/2);
            ctx.fillText('Step', 0, 0);
            ctx.restore();

            // Target lines
            ctx.strokeStyle = '#555';
            ctx.setLineDash([5, 5]);
            [targets.B, targets.DG, targets.LG, targets.W].forEach(t => {
                const x = padding + (t / 16) * (w - 2 * padding);
                ctx.beginPath();
                ctx.moveTo(x, padding);
                ctx.lineTo(x, h - padding);
                ctx.stroke();
            });
            ctx.setLineDash([]);

            // Step sizes (bar chart)
            ctx.fillStyle = color1;
            const barWidth = (w - 2 * padding) / 17 * 0.8;
            for (let pos = 0; pos <= 16; pos++) {
                const x = padding + (pos / 16) * (w - 2 * padding) - barWidth/2;
                const step = lut[pos];
                const barHeight = (step / 7) * (h - 2 * padding);
                ctx.fillRect(x, h - padding - barHeight, barWidth, barHeight);
            }

            // Position trajectory line
            ctx.strokeStyle = color2;
            ctx.lineWidth = 2;
            ctx.beginPath();
            let pos = direction === 'white' ? 0 : 16;
            const targetPos = direction === 'white' ? 16 : 0;
            let first = true;
            while ((direction === 'white' && pos < 16) || (direction === 'black' && pos > 0)) {
                const x = padding + (pos / 16) * (w - 2 * padding);
                const step = lut[pos];
                const y = h - padding - (step / 7) * (h - 2 * padding);
                if (first) {
                    ctx.moveTo(x, y);
                    first = false;
                } else {
                    ctx.lineTo(x, y);
                }
                if (direction === 'white') {
                    pos = Math.min(16, pos + step);
                } else {
                    pos = Math.max(0, pos - step);
                }
            }
            ctx.stroke();
        }

        function simulateTransition(from, to) {
            const path = [from];
            let pos = from;
            let frames = 0;
            const maxFrames = 20;

            while (pos !== to && frames < maxFrames) {
                if (to > pos) {
                    // Going toward white
                    const step = whiteLut[pos];
                    pos = Math.min(to, pos + step);
                } else {
                    // Going toward black
                    const step = blackLut[pos];
                    pos = Math.max(to, pos - step);
                }
                path.push(pos);
                frames++;
            }

            return { frames, path };
        }

        function updateTransitions() {
            const container = document.getElementById('transitions');
            container.innerHTML = '';

            const names = ['B', 'DG', 'LG', 'W'];
            const positions = [targets.B, targets.DG, targets.LG, targets.W];

            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (i === j) continue;
                    const from = positions[i];
                    const to = positions[j];
                    const result = simulateTransition(from, to);

                    const div = document.createElement('div');
                    div.className = 'transition';
                    div.innerHTML = `
                        <div>${names[i]}→${names[j]}</div>
                        <div class="frames">${result.frames}</div>
                        <div class="path">${result.path.join('→')}</div>
                    `;
                    container.appendChild(div);
                }
            }
        }

        function generateVerilog() {
            let code = '// Position macro definitions\n';
            code += `\`define POS_BLACK       5'd${targets.B}\n`;
            code += `\`define POS_DARK_GREY   5'd${targets.DG}\n`;
            code += `\`define POS_LIGHT_GREY  5'd${targets.LG}\n`;
            code += `\`define POS_WHITE       5'd${targets.W}\n\n`;

            code += '// Toward white LUT\n';
            code += 'reg [2:0] phys_pos_change_w;\n';
            code += 'always @(*) begin\n';
            code += '    case (phys_position)\n';

            // Group consecutive positions with same value
            let groups = [];
            let currentVal = whiteLut[0];
            let currentStart = 0;
            for (let i = 1; i <= 17; i++) {
                if (i === 17 || whiteLut[i] !== currentVal) {
                    groups.push({ start: currentStart, end: i - 1, val: currentVal });
                    if (i < 17) {
                        currentVal = whiteLut[i];
                        currentStart = i;
                    }
                }
            }
            groups.forEach(g => {
                const positions = [];
                for (let p = g.start; p <= g.end; p++) positions.push(`5'd${p}`);
                code += `    ${positions.join(', ')}: phys_pos_change_w = 3'd${g.val};\n`;
            });
            code += '    default: phys_pos_change_w = 3\'d2;\n';
            code += '    endcase\n';
            code += 'end\n\n';

            code += '// Toward black LUT\n';
            code += 'reg [2:0] phys_pos_change_b;\n';
            code += 'always @(*) begin\n';
            code += '    case (phys_position)\n';

            groups = [];
            currentVal = blackLut[0];
            currentStart = 0;
            for (let i = 1; i <= 17; i++) {
                if (i === 17 || blackLut[i] !== currentVal) {
                    groups.push({ start: currentStart, end: i - 1, val: currentVal });
                    if (i < 17) {
                        currentVal = blackLut[i];
                        currentStart = i;
                    }
                }
            }
            groups.forEach(g => {
                const positions = [];
                for (let p = g.start; p <= g.end; p++) positions.push(`5'd${p}`);
                code += `    ${positions.join(', ')}: phys_pos_change_b = 3'd${g.val};\n`;
            });
            code += '    default: phys_pos_change_b = 3\'d3;\n';
            code += '    endcase\n';
            code += 'end\n';

            document.getElementById('verilogCode').textContent = code;
        }

        function copyVerilog() {
            const code = document.getElementById('verilogCode').textContent;
            navigator.clipboard.writeText(code);
            alert('Verilog code copied to clipboard!');
        }

        function resetToDefault() {
            whiteLut = [5,4,3,3,3,3,3,3,3,3,2,2,2,1,1,1,1];
            blackLut = [3,3,3,2,2,2,2,2,2,2,2,2,2,2,3,4,5];

            // Update inputs
            const whiteInputs = document.querySelectorAll('#whiteLut input');
            const blackInputs = document.querySelectorAll('#blackLut input');
            whiteInputs.forEach((inp, i) => inp.value = whiteLut[i]);
            blackInputs.forEach((inp, i) => inp.value = blackLut[i]);

            update();
        }

        function update() {
            drawCurve('whiteCanvas', whiteLut, '#0f0', '#08f', 'white');
            drawCurve('blackCanvas', blackLut, '#f00', '#f80', 'black');
            updateTransitions();
            generateVerilog();
        }

        // Initialize
        initLutTable('whiteLut', whiteLut, update);
        initLutTable('blackLut', blackLut, update);
        update();
    </script>
</body>
</html>
